services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: f1lm
      POSTGRES_PASSWORD: f1lm
      POSTGRES_DB: f1lm
    ports:
      - "5433:5432"
    volumes:
      - f1lm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1lm -d f1lm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://f1lm:f1lm@postgres:5432/f1lm
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app

volumes:
  f1lm_postgres_data:
